<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>My todo list</h1>
        
        <!-- Changed to .input container to match CSS -->
        <div class="input">
            <input 
                type="text" 
                id="todoInput" 
                placeholder="Add a new task" 
                class="input-field"
            >
            <button id="addBtn" class="add-btn">Add Task</button>
        </div>

        <ul id="todoList" class="todo-list"></ul>

        <!-- Changed class from "status" to "stats" to match CSS -->
        <div class="stats">
            <p>Total: <span id="totalCount">0</span> | Completed: <span id="completedCount">0</span></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
